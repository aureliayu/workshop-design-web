<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | PajakIn</title>

    <link rel="icon" href="assets/images/logo-maroon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f7f7;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-header {
            padding: 28px 7%;
        }

        .login-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #641d32;
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;
        }

        .login-brand img {
            width: 34px;
            height: 34px;
        }

        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 60px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            padding: 42px;
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.06);
        }

        .login-card .form-control {
            padding: 12px 14px;
            border-radius: 9px;
        }

        .login-card .form-control:focus {
            border-color: #641d32;
            box-shadow: 0 0 0 0.2rem rgba(100, 29, 50, 0.12);
        }

        .login-card .btn-maroon {
            padding: 12px;
            border-radius: 9px;
        }

        .login-footer {
            padding: 20px;
            text-align: center;
            color: #777;
            font-size: 13px;
            border-top: 1px solid #eee;
        }

        .login-link {
            color: #641d32;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .login-header {
                padding: 22px 6%;
            }

            .login-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-page">

        <!-- Header -->
        <header class="login-header">
            <a href="index.html" class="login-brand">
                <img src="assets/images/logo-maroon.svg" alt="Logo PajakIn">
                PajakIn
            </a>
        </header>

        <!-- Login Form -->
        <main class="login-main">

            <form class="login-card" id="lf">

                <h1 class="h3 text-center fw-bold mb-2">
                    Selamat Datang!
                </h1>

                <p class="text-center text-muted mb-4">
                    Masuk ke akun PajakIn kamu
                </p>

                <label for="uid" class="form-label small">
                    ID Pengguna
                </label>

                <input
                    id="uid"
                    class="form-control mb-3"
                    placeholder="NIK/NPWP/NITKU"
                    autocomplete="username"
                >

                <label for="pw" class="form-label small">
                    Password
                </label>

                <input
                    id="pw"
                    type="password"
                    class="form-control mb-3"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                >

                <div id="err" class="text-danger small mb-2"></div>

                <button class="btn btn-maroon w-100">
                    Masuk
                </button>

                <p class="text-muted small text-center mt-4 mb-0">
                    Akun UMKM dibuat oleh Admin.
                </p>

                <p class="text-center small mt-3 mb-0">
                    Belum memiliki akun?
                    <a href="https://pajak-in.vercel.app/" class="login-link">
                        Ajukan akun
                    </a>
                </p>

                <!-- Demo Account -->
                <div class="border-top mt-4 pt-3">
                    <p class="text-muted small text-center mb-2">
                        Akun Demo
                    </p>

                    <p class="text-muted small text-center mb-1">
                        Admin: admin / admin123
                    </p>

                    <p class="text-muted small text-center mb-0">
                        UMKM: 3578010101900001 / umkm123
                    </p>
                </div>

            </form>

        </main>

        <!-- Footer -->
        <footer class="login-footer">
            © 2026 PajakIn. Simulasi layanan pajak UMKM.
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="assets/js/global.js"></script>

    <script>
        lf.onsubmit = e => {
            e.preventDefault();

            const id = uid.value.trim();

            if (!id || !pw.value) {
                return err.textContent = 'ID pengguna dan password wajib diisi.';
            }

            const u = umkmData.find(
                x => x.id === id && x.pw === pw.value
            );

            if (!u) {
                return err.textContent = 'ID pengguna atau password salah.';
            }

            if (u.status !== 'Aktif') {
                return err.textContent = 'Akun nonaktif. Hubungi Admin.';
            }

            sessionStorage.setItem('pj_user', u.id);

            location.href = (u.role === 'admin' ? 'admin' : 'user') + '/dashboard.html';
        };
    </script>

</body>
</html>
