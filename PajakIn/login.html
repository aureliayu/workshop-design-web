
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | PajakIn</title>

    <link rel="icon" href="assets/images/logo-maroon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #641d32;
        }

        .login {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: #641d32;
        }

        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 28px;
        }

        .login-brand img {
            width: 38px;
            height: 38px;
        }

        .lc {
            width: 100%;
            max-width: 460px;
            background: #fff;
            padding: 42px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.15);
        }

        .lc .form-control {
            padding: 12px 14px;
            border-radius: 9px;
        }

        .lc .form-control:focus {
            border-color: #641d32;
            box-shadow: 0 0 0 0.2rem rgba(100, 29, 50, 0.12);
        }

        .lc .btn-maroon {
            padding: 12px;
            border-radius: 9px;
        }

        .demo-account {
            background: #f8edf0;
            border: 1px solid #ead1d9;
            border-radius: 12px;
            padding: 16px;
        }

        .demo-title {
            color: #641d32;
            font-weight: 700;
            font-size: 14px;
        }

        .demo-label {
            color: #641d32;
            font-weight: 600;
        }

        .demo-account code {
            color: #333;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            word-break: break-word;
        }

        .login-footer {
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            text-align: center;
            margin-top: 28px;
        }

        .login-link {
            color: #641d32;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .lc {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login">

        <!-- Logo and App Name -->
        <a href="index.html" class="login-brand">
            <img src="assets/images/logo-white.svg" alt="Logo PajakIn">
            PajakIn
        </a>

        <!-- Login Form -->
        <form class="lc" id="lf">

            <h2 class="h4 text-center fw-bold">
                Selamat Datang!
            </h2>

            <p class="text-center text-muted small mb-4">
                Masuk untuk mengakses layanan PajakIn
            </p>

            <label for="uid" class="form-label small">
                ID Pengguna
            </label>

            <input
                id="uid"
                class="form-control mb-3"
                placeholder="NIK/NPWP/NITKU"
                autocomplete="username"
            >

            <label for="pw" class="form-label small">
                Password
            </label>

            <input
                id="pw"
                type="password"
                class="form-control mb-3"
                placeholder="Masukkan password"
                autocomplete="current-password"
            >

            <div id="err" class="text-danger small mb-2"></div>

            <button class="btn btn-maroon w-100">
                Masuk
            </button>

            <p class="text-muted small text-center mt-3 mb-0">
                Akun UMKM dibuat oleh Admin.
            </p>

            <p class="text-center small mt-3 mb-0">
                Belum memiliki akun?
                <a href="https://pajak-in.vercel.app/" class="login-link">
                    kembali ke index
                </a>
            </p>

            <!-- Demo Account Highlight -->
            <div class="demo-account mt-4">

                <div class="demo-title text-center mb-3">
                    <i class="bi bi-info-circle-fill me-1"></i>
                    Akun Demo
                </div>

                <div class="mb-3">
                    <div class="demo-label small mb-1">
                        <i class="bi bi-person-badge me-1"></i>
                        Admin
                    </div>

                    <code>admin / admin123</code>
                </div>

                <div>
                    <div class="demo-label small mb-1">
                        <i class="bi bi-shop me-1"></i>
                        UMKM
                    </div>

                    <code>3578010101900001 / umkm123</code>
                </div>

            </div>

        </form>

        <footer class="login-footer">
            © 2026 PajakIn. Simulasi layanan pajak UMKM.
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="assets/js/global.js"></script>

    <script>
        lf.onsubmit = e => {
            e.preventDefault();

            const id = uid.value.trim();

            if (!id || !pw.value) {
                return err.textContent = 'ID pengguna dan password wajib diisi.';
            }

            const u = umkmData.find(
                x => x.id === id && x.pw === pw.value
            );

            if (!u) {
                return err.textContent = 'ID pengguna atau password salah.';
            }

            if (u.status !== 'Aktif') {
                return err.textContent = 'Akun nonaktif. Hubungi Admin.';
            }

            sessionStorage.setItem('pj_user', u.id);

            location.href = (u.role === 'admin' ? 'admin' : 'user') + '/dashboard.html';
        };
    </script>

</body>
</html>
